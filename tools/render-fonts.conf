<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 렌더링 전용 대체 폰트 매핑.
     회사 표준 폰트(현대하모니 L)가 없는 리눅스 렌더 환경에서
     자간/자폭이 비슷한 한글 고딕으로 대체해 미리보기 신뢰도를 높인다.
     PPTX 안의 폰트 지정 자체는 바뀌지 않는다. -->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>현대하모니 L</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumBarunGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>맑은 고딕</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumBarunGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>굴림</string></test>
    <edit name="family" mode="assign" binding="strong"><string>NanumGothic</string></edit>
  </match>
</fontconfig>
